<!doctype html>
<html lang="en" %sveltekit.htmlattributes%>
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
		<link rel="manifest" href="/manifest.webmanifest" />
		<link rel="stylesheet" href="/fonts/fonts.css" />
		<meta name="theme-color" content="#f4f5f7" media="(prefers-color-scheme: light)" />
		<meta name="theme-color" content="#101216" media="(prefers-color-scheme: dark)" />
		<script>
			// Apply the saved theme before first paint so the page never flashes
			// the wrong one.
			try {
				var t = localStorage.getItem('theme');
				if (t) document.documentElement.dataset.theme = t;
			} catch (e) {}
		</script>
		<!-- Privacy-friendly analytics by Plausible -->
		<script async src="https://plausible.io/js/pa-MD_f2Bxg0RCPNGkN52GhZ.js"></script>
		<script>
			window.plausible =
				window.plausible ||
				function () {
					(plausible.q = plausible.q || []).push(arguments);
				};
			plausible.init =
				plausible.init ||
				function (i) {
					plausible.o = i || {};
				};
			plausible.init();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
